<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Projects | Kaung Htet Ko</title>
    <meta name="description"
        content="Browse all projects by Kaung Htet Ko, including mobile development and portfolio improvements.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../css/styles.css">
</head>

<body>
    <nav class="nav scrolled" id="navbar">
        <div class="nav-container">
            <a href="../index.html" class="nav-logo">KHK<span class="dot">.</span></a>
            <div class="nav-links" id="navLinks">
                <a href="../index.html#projects" class="nav-link active">Projects</a>
                <a href="../index.html#blog" class="nav-link">Blog</a>
                <a href="../index.html#about" class="nav-link">About</a>
                <a href="../index.html#contact" class="nav-link">Contact</a>
            </div>
            <button class="nav-mobile-toggle" id="navToggle" aria-label="Toggle menu">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>
    </nav>

    <main class="post-page">
        <div class="post-content">
            <a href="../index.html" class="back-link">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M19 12H5M12 19l-7-7 7-7" />
                </svg>
                Back to Home
            </a>

            <header class="post-header">
                <h1 class="post-title">Projects</h1>
                <p class="post-meta">All projects I've built and worked on</p>
            </header>

            <div class="blog-list" id="allProjectsGrid">
                <!-- All project cards loaded dynamically -->
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="main-content" style="padding-top: 0; padding-bottom: 0;">
            <div class="footer-content">
                <p class="footer-text">© 2026 Kaung Htet Ko</p>
                <p class="footer-text">Myanmar → South Korea</p>
            </div>
        </div>
    </footer>

    <script>
        const navToggle = document.getElementById('navToggle');
        const navLinks = document.getElementById('navLinks');
        navToggle.addEventListener('click', () => {
            navToggle.classList.toggle('active');
            navLinks.classList.toggle('active');
        });

        const allProjectsGrid = document.getElementById('allProjectsGrid');

        async function loadAllProjects() {
            try {
                const response = await fetch('posts.json');
                const projects = await response.json();
                projects.sort((a, b) => new Date(b.date) - new Date(a.date));

                allProjectsGrid.innerHTML = projects.map(project => {
                    const techTags = project.techStack
                        ? project.techStack.join(', ')
                        : '';

                    return `
                    <a href="${project.slug}/index.html" class="blog-list-item">
                        <div class="blog-list-left">
                            <div class="blog-list-meta">
                                <span>${project.displayDate}</span>
                                <span class="dot">·</span>
                                <span>${project.tag}</span>
                            </div>
                            <h3 class="blog-list-title">${project.title} — ${project.subtitle}</h3>
                            ${techTags ? `<span style="font-size: 13px; color: var(--muted);">${techTags}</span>` : ''}
                        </div>
                        <span class="blog-list-arrow">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
                                <path d="M5 12h14M12 5l7 7-7 7" />
                            </svg>
                        </span>
                    </a>
                    `;
                }).join('');
            } catch (error) {
                console.error('Error loading projects:', error);
                allProjectsGrid.innerHTML = '<p style="color: var(--muted);">Unable to load projects.</p>';
            }
        }

        loadAllProjects();
    </script>
</body>

</html>
