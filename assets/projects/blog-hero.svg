<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <rect width="400" height="300" fill="#1a1a1f"/>
  <!-- Abstract code/editor shapes -->
  <rect x="40" y="40" width="320" height="220" rx="8" fill="#222228" stroke="#5B9A8B" stroke-width="1" opacity="0.3"/>
  <!-- Window dots -->
  <circle cx="60" cy="56" r="4" fill="#5B9A8B" opacity="0.3"/>
  <circle cx="76" cy="56" r="4" fill="#5B9A8B" opacity="0.2"/>
  <circle cx="92" cy="56" r="4" fill="#5B9A8B" opacity="0.15"/>
  <!-- Line numbers -->
  <text x="56" y="90" fill="#5B9A8B" opacity="0.2" font-family="monospace" font-size="10">1</text>
  <text x="56" y="110" fill="#5B9A8B" opacity="0.2" font-family="monospace" font-size="10">2</text>
  <text x="56" y="130" fill="#5B9A8B" opacity="0.2" font-family="monospace" font-size="10">3</text>
  <text x="56" y="150" fill="#5B9A8B" opacity="0.2" font-family="monospace" font-size="10">4</text>
  <text x="56" y="170" fill="#5B9A8B" opacity="0.2" font-family="monospace" font-size="10">5</text>
  <text x="56" y="190" fill="#5B9A8B" opacity="0.2" font-family="monospace" font-size="10">6</text>
  <!-- Code lines -->
  <rect x="76" y="84" width="120" height="8" rx="2" fill="#5B9A8B" opacity="0.2"/>
  <rect x="76" y="104" width="80" height="8" rx="2" fill="#5B9A8B" opacity="0.15"/>
  <rect x="76" y="124" width="200" height="8" rx="2" fill="#5B9A8B" opacity="0.25"/>
  <rect x="76" y="144" width="160" height="8" rx="2" fill="#5B9A8B" opacity="0.18"/>
  <rect x="76" y="164" width="100" height="8" rx="2" fill="#5B9A8B" opacity="0.2"/>
  <rect x="76" y="184" width="140" height="8" rx="2" fill="#5B9A8B" opacity="0.15"/>
  <!-- Cursor -->
  <rect x="220" y="184" width="2" height="12" fill="#5B9A8B" opacity="0.5"/>
  <!-- Label -->
  <text x="200" y="270" text-anchor="middle" fill="#5B9A8B" opacity="0.4" font-family="monospace" font-size="10">Blog Improvements</text>
</svg>
