<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <rect width="800" height="500" fill="#1a1a1f"/>
  <!-- Abstract map/report shapes -->
  <circle cx="200" cy="250" r="80" fill="#5B9A8B" opacity="0.15"/>
  <circle cx="200" cy="250" r="40" fill="#5B9A8B" opacity="0.25"/>
  <circle cx="200" cy="250" r="8" fill="#5B9A8B" opacity="0.6"/>
  <!-- Grid lines -->
  <line x1="320" y1="120" x2="320" y2="380" stroke="#5B9A8B" stroke-width="1" opacity="0.1"/>
  <line x1="400" y1="120" x2="400" y2="380" stroke="#5B9A8B" stroke-width="1" opacity="0.1"/>
  <line x1="480" y1="120" x2="480" y2="380" stroke="#5B9A8B" stroke-width="1" opacity="0.1"/>
  <line x1="560" y1="120" x2="560" y2="380" stroke="#5B9A8B" stroke-width="1" opacity="0.1"/>
  <line x1="640" y1="120" x2="640" y2="380" stroke="#5B9A8B" stroke-width="1" opacity="0.1"/>
  <line x1="300" y1="160" x2="700" y2="160" stroke="#5B9A8B" stroke-width="1" opacity="0.1"/>
  <line x1="300" y1="220" x2="700" y2="220" stroke="#5B9A8B" stroke-width="1" opacity="0.1"/>
  <line x1="300" y1="280" x2="700" y2="280" stroke="#5B9A8B" stroke-width="1" opacity="0.1"/>
  <line x1="300" y1="340" x2="700" y2="340" stroke="#5B9A8B" stroke-width="1" opacity="0.1"/>
  <!-- Data points -->
  <rect x="340" y="180" width="40" height="60" rx="4" fill="#5B9A8B" opacity="0.3"/>
  <rect x="420" y="150" width="40" height="90" rx="4" fill="#5B9A8B" opacity="0.4"/>
  <rect x="500" y="200" width="40" height="40" rx="4" fill="#5B9A8B" opacity="0.25"/>
  <rect x="580" y="170" width="40" height="70" rx="4" fill="#5B9A8B" opacity="0.35"/>
  <rect x="660" y="210" width="40" height="30" rx="4" fill="#5B9A8B" opacity="0.2"/>
  <!-- Notification dot -->
  <circle cx="680" cy="140" r="12" fill="#5B9A8B" opacity="0.5"/>
  <circle cx="680" cy="140" r="5" fill="#e8e6e3" opacity="0.8"/>
  <!-- Label -->
  <text x="400" y="440" text-anchor="middle" fill="#5B9A8B" opacity="0.4" font-family="monospace" font-size="12">MANFO — Disaster Reporting Dashboard</text>
</svg>
